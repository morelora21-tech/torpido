<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torpido</title>
<style>
:root{--y:#1f4fd8;--yt:#fff;--bg:#efefef;--sf:#fff;--tx:#2b2b2b;--mu:#777;--ln:#e0e0e0;--lk:#1f5aa6;--pr:#c8102e;--ok:#1b8a4b;--wr:#b36b00;--zb:#f7f7f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--sf:#222;--tx:#ececec;--mu:#999;--ln:#383838;--lk:#7fb0ff;--pr:#ff6b78;--ok:#4cd488;--wr:#f0b429;--zb:#1b1b1b}}
:root[data-theme="dark"]{--bg:#161616;--sf:#222;--tx:#ececec;--mu:#999;--ln:#383838;--lk:#7fb0ff;--pr:#ff6b78;--ok:#4cd488;--wr:#f0b429;--zb:#1b1b1b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;font:14px/1.35 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden;border-inline:1px solid var(--ln)}
main{flex:1;overflow:auto;overflow-x:hidden}
.hd{background:var(--y);color:var(--yt);padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.hd .bk{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--yt);padding:0 2px}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}
.hd .sr{flex:1;display:flex;min-width:0}.hd input{border:0;border-radius:3px 0 0 3px;min-width:0}
.hd .go{border:0;background:var(--yt);color:var(--y);width:40px;border-radius:0 3px 3px 0;font-size:18px;cursor:pointer}
.hd h1{margin:0;font-size:16px;flex:1}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:3px;padding:9px 10px;width:100%}
select{padding:8px 6px}
.fb{background:var(--sf);border-bottom:1px solid var(--ln);padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt{padding:8px 12px;font-size:12px;color:var(--mu)}
.it{display:flex;gap:10px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln);cursor:pointer;position:relative}
.th{width:116px;height:88px;flex:none;background:#e6e6e6;overflow:hidden;display:grid;place-items:center;position:relative}
.th img,.big img{width:100%;height:100%;object-fit:cover}.th svg{width:100%;padding:6px}
.th .vb{position:absolute;left:0;bottom:0;background:var(--ok);color:#fff;font-size:10px;font-weight:700;padding:2px 6px}
.in{flex:1;min-width:0}
.tt{color:var(--lk);font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb{color:var(--mu);font-size:12px;margin-top:2px}
.pr{color:var(--pr);font-weight:800;font-size:17px;margin-top:3px}
.dl{font-size:11px;font-weight:700;margin-left:6px}.ok{color:var(--ok)}.wr{color:var(--wr)}.bd{color:var(--pr)}
.fv{position:absolute;right:8px;top:8px;border:0;background:none;font-size:20px;color:#bbb;cursor:pointer}.fv.on{color:var(--pr)}
.big{background:#e6e6e6;aspect-ratio:4/3;display:grid;place-items:center;position:relative}.big svg{width:90%}
.big small{position:absolute;right:8px;bottom:6px;background:#0007;color:#fff;font-size:11px;padding:2px 6px;border-radius:2px}
.box{background:var(--sf);border-bottom:1px solid var(--ln);padding:12px}
.box h2{margin:0 0 4px;font-size:17px}.box .pr{font-size:24px;margin:6px 0}
.sh{background:var(--zb);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:8px 12px;font-weight:700;font-size:13px;border-left:4px solid var(--y)}
.kv div{display:flex;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}.kv div:nth-child(even){background:var(--zb)}
.kv b{width:42%;color:var(--mu);font-weight:400}.kv span{flex:1;font-weight:700}
.gauge{display:flex;align-items:center;gap:12px}.gauge svg{width:140px;flex:none}
.bar{height:8px;background:linear-gradient(90deg,var(--ok),var(--wr),var(--pr));position:relative;margin:16px 0 6px;border-radius:4px}
.bar i{position:absolute;top:-5px;width:4px;height:18px;background:var(--tx);transform:translateX(-50%)}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:14px}
.tl div{position:relative;padding-bottom:10px}.tl div:last-child{padding-bottom:0}
.tl div:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.tl small{display:block;color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:12px}
.act{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:var(--sf);border-top:1px solid var(--ln)}
.btn{flex:1;border:0;border-radius:3px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--y);color:var(--yt)}
.btn.o{background:var(--sf);border:1px solid var(--y);color:var(--y)}
.fm{padding:12px}.fm h2{margin:0 0 6px;font-size:18px}.fm .btn{width:100%;margin-top:10px;flex:none}
.empty{padding:36px 20px;text-align:center;color:var(--mu)}
.ft{padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}.ft b{display:block;color:var(--lk)}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;border-top:3px solid transparent;background:none;padding:7px 0 6px;font:inherit;font-size:11px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--tx);font-weight:700;border-top-color:var(--y)}
.ov{position:absolute;inset:0;display:none}.ov.on{display:flex}
#dr{z-index:5}#dr .dp{width:84%;background:var(--sf);overflow:auto;height:100%}#dr .dv{flex:1;background:#0009}
.dp .us{background:var(--y);color:var(--yt);padding:22px 14px 14px}.dp .us b{display:block;font-size:17px}
.dp .sec{padding:8px 14px;font-size:12px;font-weight:700;color:var(--mu);background:var(--zb);border-bottom:1px solid var(--ln)}
.dp button.mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;padding:13px 14px;cursor:pointer}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln)}.rw input{width:auto}.rw select{width:120px}
#fo{z-index:6;flex-direction:column;background:var(--bg)}.fbd{flex:1;overflow:auto;padding:12px}
.fl{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}.fl input,.fl select{margin-top:4px;color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:14px}.ck input{width:auto}
.ffoot{display:flex;gap:8px;padding:10px 12px;background:var(--sf);border-top:1px solid var(--ln)}
#sh2{z-index:4;align-items:flex-end;background:#0009}
.sheet{background:var(--sf);width:100%;padding:12px;max-height:82%;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--y)}
.msgs{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:100px}
.m{max-width:80%;padding:8px 10px;border-radius:4px;background:var(--zb);border:1px solid var(--ln)}.m.me{align-self:flex-end;background:var(--y);color:var(--yt);border-color:var(--y)}
.qr{display:flex;gap:6px;flex-wrap:wrap}.qr button{border:1px solid var(--ln);background:var(--sf);color:var(--lk);border-radius:99px;padding:6px 10px;font-size:12px;cursor:pointer}
#ts{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:3px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:90%;text-align:center;z-index:9}#ts.on{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lk);outline-offset:2px}
</style></head><body>

const F0={brand:"Tümü",minP:0,maxP:0,minY:0,maxY:0,maxKm:0,fuel:"Tümü",gear:"Tümü",city:"Tümü",cl:"Tümü",from:"Tümü",dmg:"Tümü",ts:0,ver:false,deal:false};
const S={tab:"home",open:null,sort:"ts",q:"",f:{...F0},favs:new Set([3]),chat:null,chats:{},n:{price:true,newl:false,msg:true}};
const $=s=>document.querySelector(s),TL=n=>n.toLocaleString("tr-TR")+" TL",KM=n=>n.toLocaleString("tr-TR")+" km";
const car=c=>`<svg viewBox="0 0 200 84" aria-hidden="true"><ellipse cx="100" cy="78" rx="84" ry="4" fill="#0003"/><path d="M10 62 L26 40 Q32 32 46 32 H112 Q124 32 134 42 L152 50 Q178 52 188 62 V68 H10Z" fill="${c}"/><path d="M38 40 H70 V52 H30Z M76 40 H110 L126 52 H76Z" fill="#fff8"/><g fill="#111827"><circle cx="48" cy="68" r="12"/><circle cx="148" cy="68" r="12"/></g><g fill="#cbd5e1"><circle cx="48" cy="68" r="5"/><circle cx="148" cy="68" r="5"/></g></svg>`;
const pic=l=>l.img?`<img src="${l.img}" alt="${l.b} ${l.t}">`:car(l.c);
const dl=l=>{const a=(l.m[0]+l.m[1])/2,p=(l.p-a)/a*100;return p<-4?["ok","Uygun fiyat"]:p>4?["bd","Yüksek fiyat"]:["wr","Piyasa fiyatı"]};
const dt=l=>(14-l.id%6)+" Ekim 2026",no=l=>1180200000+l.id*7919;
const uniq=k=>["Tümü",...new Set(L.map(x=>x[k]))];
const match=l=>{const F=S.f;return(F.brand=="Tümü"||l.b==F.brand)&&(!F.minP||l.p>=F.minP)&&(!F.maxP||l.p<=F.maxP)&&(!F.minY||l.y>=F.minY)&&(!F.maxY||l.y<=F.maxY)&&(!F.maxKm||l.km<=F.maxKm)&&(F.fuel=="Tümü"||l.f==F.fuel)&&(F.gear=="Tümü"||l.g==F.gear)&&(F.city=="Tümü"||l.city==F.city)&&(F.cl=="Tümü"||l.cl==F.cl)&&(F.from=="Tümü"||l.s==F.from)&&(F.dmg=="Tümü"||(F.dmg=="temiz"?l.ok:!l.ok))&&(!F.ver||l.v)&&(!F.deal||dl(l)[0]=="ok")&&l.ts>=F.ts&&(l.b+" "+l.t).toLowerCase().includes(S.q.toLowerCase())};
const filtered=()=>L.filter(match).sort((x,y)=>S.sort=="ts"?y.ts-x.ts:S.sort=="pa"?x.p-y.p:S.sort=="pd"?y.p-x.p:x.km-y.km);
const nfil=()=>Object.keys(F0).filter(k=>S.f[k]!==F0[k]).length;
const row=l=>{const[k,n]=dl(l);return`<div class="it" onclick="S.open=${l.id};render()"><div class="th">${pic(l)}${l.v?'<span class="vb">✓ Doğrulanmış</span>':""}</div><div class="in"><div class="tt">${l.y} ${l.b} ${l.t}</div><div class="sb">${l.y} · ${KM(l.km)} · ${l.cl}</div><div class="pr">${TL(l.p)}<span class="dl ${k}">${n}</span></div><div class="sb">${l.city} · ${dt(l)}</div></div><button class="fv ${S.favs.has(l.id)?"on":""}" aria-label="Favori" onclick="event.stopPropagation();fav(${l.id})">♥</button></div>`};
function fav(id){S.favs.has(id)?S.favs.delete(id):S.favs.add(id);render(true)}
function toast(t){const e=$("#ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove("on"),2200)}
const bar=t=>`<div class="hd"><button class="bk" aria-label="Menü" onclick="drawer(1)">☰</button>${t}</div>`;
function res(){const a=filtered();return`<div class="cnt">${a.length} ilan listeleniyor</div>`+(a.length?a.map(row).join(""):'<div class="empty">Bu filtrelerle ilan yok. Filtreleri genişlet ya da temizle.</div>')}
function home(){return bar(`<span class="logo">torpido</span><div class="sr"><input placeholder="Kelime veya ilan no" value="${S.q}" oninput="S.q=this.value;upd()" aria-label="Ara"><button class="go" aria-label="Ara">⌕</button></div>`)+`<div class="fb"><button class="btn o" id="fcnt" onclick="openF()">${nfil()?"Filtrele ("+nfil()+")":"Filtrele"}</button><select onchange="S.sort=this.value;upd()" aria-label="Sırala"><option value="ts" ${S.sort=="ts"?"selected":""}>Güven skoru</option><option value="pa" ${S.sort=="pa"?"selected":""}>Fiyat (artan)</option><option value="pd" ${S.sort=="pd"?"selected":""}>Fiyat (azalan)</option><option value="km" ${S.sort=="km"?"selected":""}>Km (düşük)</option></select></div><div id="ls">${res()}</div>`}
function upd(){const e=$("#ls");if(e&&S.tab=="home"&&S.open==null){e.innerHTML=res();$("#fcnt").textContent=nfil()?"Filtrele ("+nfil()+")":"Filtrele"}const g=$("#fgo");if(g)g.textContent=filtered().length+" ilanı göster"}
function setF(k,v){S.f[k]=["minP","maxP","minY","maxY","maxKm","ts"].includes(k)?(+v||0):v;upd()}
const sel=(lb,k,o)=>`<label class="fl">${lb}<select onchange="setF('${k}',this.value)">${o.map(x=>{const[v,t]=Array.isArray(x)?x:[x,x];return`<option value="${v}" ${String(S.f[k])==String(v)?"selected":""}>${t}</option>`}).join("")}</select></label>`;
const num=(lb,k,ph)=>`<label class="fl">${lb}<input type="number" inputmode="numeric" min="0" placeholder="${ph}" value="${S.f[k]||""}" oninput="setF('${k}',this.value)"></label>`;
function openF(){$("#fo").innerHTML=`<div class="hd"><button class="bk" aria-label="Kapat" onclick="$('#fo').classList.remove('on')">×</button><h1>Filtrele</h1></div><div class="fbd">${sel("Marka","brand",uniq("b"))}<div class="g2">${num("Fiyat (en az, TL)","minP","0")}${num("Fiyat (en çok, TL)","maxP","2.000.000")}</div><div class="g2">${num("Yıl (en az)","minY","2015")}${num("Yıl (en çok)","maxY","2026")}</div>${num("Kilometre (en çok)","maxKm","100000")}<div class="g2">${sel("Yakıt","fuel",uniq("f"))}${sel("Vites","gear",uniq("g"))}</div><div class="g2">${sel("Şehir","city",uniq("city"))}${sel("Renk","cl",uniq("cl"))}</div><div class="g2">${sel("Kimden","from",uniq("s"))}${sel("Güven skoru","ts",[[0,"Hepsi"],[80,"80 ve üzeri"],[90,"90 ve üzeri"]])}</div>${sel("Hasar durumu","dmg",[["Tümü","Hepsi"],["temiz","Boyasız, değişen yok"],["var","Boya veya değişen var"]])}<label class="ck"><input type="checkbox" ${S.f.ver?"checked":""} onchange="setF('ver',this.checked)"> Sadece Torpido doğrulamalı</label><label class="ck"><input type="checkbox" ${S.f.deal?"checked":""} onchange="setF('deal',this.checked)"> Sadece uygun fiyatlı ilanlar</label></div><div class="ffoot"><button class="btn o" onclick="S.f={...F0};openF();upd()">Temizle</button><button class="btn" id="fgo" onclick="$('#fo').classList.remove('on')">${filtered().length} ilanı göster</button></div>`;$("#fo").classList.add("on")}
function drawer(o){const d=$("#dr");if(!o)return d.classList.remove("on");const nt=(k,t)=>`<label class="rw">${t}<input type="checkbox" ${S.n[k]?"checked":""} onchange="S.n.${k}=this.checked"></label>`;
d.innerHTML=`<div class="dp"><div class="us"><b>Misafir</b><span style="font-size:13px">Giriş yap veya üye ol</span></div><div class="sec">Menü</div><button class="mi" onclick="go('home')">İlanlar</button><button class="mi" onclick="go('favs')">Favori ilanlarım</button><button class="mi" onclick="go('sell')">İlan ver</button><button class="mi" onclick="go('me')">Neden Torpido?</button><div class="sec">Ayarlar</div><label class="rw">Görünüm<select onchange="theme(this.value)"><option value="auto">Sistem</option><option value="light">Açık</option><option value="dark">Koyu</option></select></label>${nt("price","Fiyat düşünce haber ver")}${nt("newl","Yeni ilan bildirimi")}${nt("msg","Mesaj bildirimi")}<label class="rw">Dil<select aria-label="Dil"><option>Türkçe</option></select></label><button class="mi" onclick="toast('Kayıtlı aramalar yakında (prototip)')">Kayıtlı aramalarım</button><button class="mi" onclick="toast('Yardım merkezi yakında (prototip)')">Yardım ve destek</button></div><div class="dv" onclick="drawer(0)"></div>`;d.classList.add("on");d.querySelector("select").value=document.documentElement.dataset.theme||"auto"}
function theme(v){v=="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.dataset.theme=v}
function go(t){S.tab=t;S.open=null;drawer(0);render()}
function favv(){const a=L.filter(l=>S.favs.has(l.id));return bar('<h1>Favori ilanlarım</h1>')+(a.length?a.map(row).join(""):'<div class="empty">Henüz favori ilanın yok. İlan listesinde kalp simgesine dokun; fiyatı düşerse haber verelim.</div>')}
function detail(id){const l=L.find(x=>x.id==id),[k,n]=dl(l),a=(l.m[0]+l.m[1])/2,pc=Math.round((l.p-a)/a*100),pos=Math.max(4,Math.min(96,(l.p-l.m[0])/(l.m[1]-l.m[0])*100)),arc=l.ts/100*157,col=l.ts>=80?"var(--ok)":l.ts>=65?"var(--wr)":"var(--pr)";
const kv=[["İlan no",no(l)],["İlan tarihi",dt(l)],["Marka",l.b],["Model",l.t],["Yıl",l.y],["Yakıt",l.f],["Vites",l.g],["Kilometre",KM(l.km)],["Renk",l.cl],["Hasar durumu",l.d],["Kimden",l.s]];
return`<div class="hd"><button class="bk" aria-label="Geri" onclick="S.open=null;render()">‹</button><h1>İlan detayı</h1><button class="fv ${S.favs.has(l.id)?"on":""}" style="position:static;color:${S.favs.has(l.id)?"var(--pr)":"#fff"}" aria-label="Favori" onclick="fav(${l.id})">♥</button></div>
<div class="big">${pic(l)}${l.img?"":"<small>Fotoğraf eklenecek</small>"}</div>
<div class="box"><h2>${l.y} ${l.b} ${l.t}</h2><div class="pr">${TL(l.p)} <span class="dl ${k}">${n}</span></div><div class="mu">${l.city} · ${dt(l)}</div></div>
<div class="sh">İlan bilgileri</div><div class="kv">${kv.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
<div class="sh">Torpido güven skoru</div><div class="box"><div class="gauge"><svg viewBox="0 0 120 70"><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="var(--ln)" stroke-width="12" stroke-linecap="round"/><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${arc} 157"/><text x="60" y="58" text-anchor="middle" font-size="26" font-weight="900" fill="var(--tx)">${l.ts}</text></svg><div class="mu" style="font-size:13px">${l.v?"Kimlik, plaka ve km geçmişi doğrulandı. Kayıtlar birbiriyle tutarlı.":"Doğrulama bekleniyor. Satıcıdan belge ve kayıt istemeni öneririz."}</div></div></div>
<div class="sh">Fiyat analizi</div><div class="box"><div class="mu" style="font-size:13px">Benzer araçların piyasa aralığı: ${TL(l.m[0])} – ${TL(l.m[1])}</div><div class="bar"><i style="left:${pos}%"></i></div><b>Bu ilan piyasa ortalamasının ${pc<0?"%"+(-pc)+" altında":pc>0?"%"+pc+" üstünde":"tam seviyesinde"}.</b></div>
<div class="sh">Araç geçmişi</div><div class="box"><div class="tl">${l.h.map(e=>`<div>${e[1]}<small>${e[0]}</small></div>`).join("")}</div></div>
<div class="box mu">Satıcının telefon numarası paylaşılmaz. Tüm görüşmeler uygulama içinde yapılır.</div>
<div class="act"><button class="btn o" onclick="toast('Ekspertiz talebin iletildi (prototip)')">Ekspertiz randevusu</button><button class="btn" onclick="openChat(${l.id})">Mesaj gönder</button></div>`}
function openChat(id){S.chat=id;S.chats[id]=S.chats[id]||[];drawChat();$("#sh2").classList.add("on")}
function drawChat(){const l=L.find(x=>x.id==S.chat);$("#sh2").innerHTML=`<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b>${l.b} ${l.t} · ${l.s}</b><button style="border:0;background:none;font-size:24px;cursor:pointer;color:var(--tx)" aria-label="Kapat" onclick="$('#sh2').classList.remove('on')">×</button></div>
<div class="msgs">${S.chats[S.chat].length?S.chats[S.chat].map(m=>`<div class="m ${m.me?"me":""}">${m.t}</div>`).join(""):'<div class="mu">Bir mesaj seç ya da yaz. Numaran satıcıya gösterilmez.</div>'}</div>
<div class="qr">${["Son fiyat ne?","Takas olur mu?","Ekspertiz yaptırabilir miyim?"].map(q=>`<button onclick="send('${q}')">${q}</button>`).join("")}</div>
<div style="display:flex;gap:8px"><input id="mi" placeholder="Mesajını yaz" onkeydown="if(event.key=='Enter')send()"><button class="btn" style="flex:none" onclick="send()">Gönder</button></div></div>`}
function send(t){t=t||$("#mi").value.trim();if(!t)return;const id=S.chat;S.chats[id].push({t,me:1});drawChat();setTimeout(()=>{S.chats[id].push({t:"Merhaba, araç hâlâ satılık. Ekspertize uygunum, günü birlikte belirleyelim."});if(S.chat==id)drawChat()},900)}
function sell(){return bar('<h1>İlan ver</h1>')+`<div class="fm"><h2>Aracını 2 dakikada sat</h2><p class="mu">Plakayı gir, araç bilgilerini otomatik getirelim. (Prototip: örnek veri gösterilir.)</p><input id="pl" placeholder="Plaka, örn. 33 ABC 123" aria-label="Plaka"><button class="btn" onclick="fill()">Bilgileri getir</button><div id="fl"></div></div>`}
function fill(){if(!$("#pl").value.trim())return toast("Önce plakayı gir");$("#fl").innerHTML=`<div class="sh" style="margin:14px -12px 0">Araç bilgileri</div><div class="kv" style="margin:0 -12px"><div><b>Araç</b><span>2020 Toyota Corolla 1.6 Dream</span></div><div><b>Kilometre</b><span>62.400 km</span></div><div><b>Yakıt / vites</b><span>Benzin / Otomatik</span></div></div><div class="sh" style="margin:0 -12px">Önerilen fiyat</div><div class="box" style="margin:0 -12px"><div class="pr">1.120.000 – 1.240.000 TL</div><div class="mu">Benzer ilanlara göre. Bu aralıkta ilanlar daha hızlı satılıyor.</div></div><button class="btn" onclick="toast('İlanın yayına alındı (prototip)')">İlanı yayınla</button>`}
function me(){const f=[["Doğrulanmış araç geçmişi","Km, servis ve tramer kayıtları ilanın içinde, satıcı beyanı olarak değil."],["Adil fiyat analizi","Her ilanda piyasa aralığı ve fiyatın nerede durduğu görünür."],["Telefon numaran gizli","Görüşmeler uygulama içinde yapılır; istenmeyen aramalar olmaz."],["Tek dokunuşla ekspertiz","İlandan çıkmadan randevu al, rapor ilana eklensin."],["Güven skoru","Eksik belgeli veya tutarsız ilanlar daha düşük skorla işaretlenir."]];
return bar('<h1>Neden Torpido?</h1>')+`<div class="box"><div class="mu" style="font-size:13px">İlan sitelerinde asıl sorun fiyat değil, güven. Torpido her ilanı kanıtıyla birlikte gösterir.</div></div>${f.map(x=>`<div class="ft"><b>${x[0]}</b><span class="mu">${x[1]}</span></div>`).join("")}`}
function render(keep){const m=$("#v"),y=m.scrollTop;m.innerHTML=S.open!=null?detail(S.open):({home,favs:favv,sell,me})[S.tab]();m.scrollTop=keep?y:0;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==S.tab&&S.open==null))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
render();
</script></body></html>
